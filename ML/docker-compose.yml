services:
  campusquest-recognition:
    build: .
    image: campusquest-image-recognition:local
    restart: unless-stopped
    environment:
      INFERENCE_API_TOKEN: ${INFERENCE_API_TOKEN:?Set INFERENCE_API_TOKEN in .env}
      GALLERY_PATH: /data/gallery.npz
      GALLERY_EXCLUDE_FILE: /app/config/gallery_exclude.txt
      PHOTOS_DIR: /app/photos
      AUTO_BUILD_GALLERY: ${AUTO_BUILD_GALLERY:-true}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.20}
      MIN_MARGIN: ${MIN_MARGIN:-0.04}
      MAX_IMAGE_BYTES: ${MAX_IMAGE_BYTES:-8388608}
      PORT: 8000
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
    volumes:
      - gallery-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s

volumes:
  gallery-data:
