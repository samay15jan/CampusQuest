services:
  api:
    build: .
    container_name: campusquest-api
    command: sh -c "node scripts/migrate.js && node scripts/seed.js && npx nodemon --legacy-watch src/server.js"
    ports:
      - "4000:4000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 4000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campusquest
      DB_USER: campus
      DB_PASSWORD: campus123
      UPLOAD_DIR: /app/uploads
      IMAGE_MATCHER: http
      IMAGE_MATCHER_URL: http://campusquest-recognition:8000/v1/predict
      IMAGE_MATCHER_TIMEOUT_MS: 15000
      IMAGE_MATCH_THRESHOLD: 0.70
      INFERENCE_API_TOKEN: ${INFERENCE_API_TOKEN:?Set INFERENCE_API_TOKEN in backend/.env}
    volumes:
      - ./src:/app/src
      - ./db:/app/db:ro
      - ./scripts:/app/scripts:ro
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      campusquest-recognition:
        condition: service_healthy

  campusquest-recognition:
    build:
      context: ../ML
    image: campusquest-image-recognition:local
    container_name: campusquest-recognition
    restart: unless-stopped
    environment:
      INFERENCE_API_TOKEN: ${INFERENCE_API_TOKEN:?Set INFERENCE_API_TOKEN in backend/.env}
      GALLERY_PATH: /data/gallery.npz
      GALLERY_EXCLUDE_FILE: /app/config/gallery_exclude.txt
      PHOTOS_DIR: /app/photos
      AUTO_BUILD_GALLERY: ${AUTO_BUILD_GALLERY:-true}
      MIN_SIMILARITY: ${MIN_SIMILARITY:-0.65}
      MIN_MARGIN: ${MIN_MARGIN:-0.04}
      MAX_IMAGE_BYTES: 8388608
      PORT: 8000
    volumes:
      - recognition-gallery:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 600s

  postgres:
    image: postgres:16
    container_name: campusquest-postgres
    environment:
      POSTGRES_DB: campusquest
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campusquest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
  recognition-gallery:
