services:
  api:
    build: .
    container_name: campusquest-api
    # Apply migrations + (idempotent) seed, then start with hot reload.
    command: sh -c "node scripts/migrate.js && node scripts/seed.js && npx nodemon --legacy-watch src/server.js"
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: campusquest
      DB_USER: campus
      DB_PASSWORD: campus123
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./src:/app/src
      - ./db:/app/db:ro
      - ./scripts:/app/scripts:ro
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: campusquest-postgres
    environment:
      POSTGRES_DB: campusquest
      POSTGRES_USER: campus
      POSTGRES_PASSWORD: campus123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campus -d campusquest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  uploads:
